<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>未来ノート｜瞳が知っている、あなたの物語</title>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;700;800&family=Share+Tech+Mono&family=Noto+Sans+JP:wght@300;400;700&display=swap" rel="stylesheet">
<style>
:root {
    --black: #000000;
    --deep: #050810;
    --gold: #c9a84c;
    --gold2: #f0d080;
    --neon: #00e5ff;
    --white: #f0ece4;
    --glow-gold: 0 0 15px rgba(201,168,76,0.5);
    --glow-neon: 0 0 20px rgba(0,229,255,0.6);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    background: var(--deep);
    color: var(--white);
    font-family: 'Noto Sans JP', sans-serif;
    overflow-x: hidden;
    min-height: 100vh;
}

.phase { display: none; }
.phase.active { display: block; }

/* ─── LP ─── */
#phase-landing {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    position: relative;
    overflow: hidden;
}
#phase-landing::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 30%, rgba(201,168,76,0.08) 0%, transparent 70%);
    pointer-events: none;
}
.lp-deco {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.65rem;
    color: rgba(201,168,76,0.3);
    letter-spacing: 0.2em;
    margin-bottom: 30px;
}
.lp-eyecatch {
    font-family: 'Shippori Mincho', serif;
    font-size: 2.2rem;
    font-weight: 800;
    color: var(--gold2);
    text-align: center;
    line-height: 1.5;
    text-shadow: var(--glow-gold);
    margin-bottom: 16px;
    letter-spacing: 0.1em;
}
.lp-sub {
    font-family: 'Shippori Mincho', serif;
    font-size: 0.85rem;
    color: rgba(240,208,128,0.6);
    letter-spacing: 0.3em;
    text-align: center;
    margin-bottom: 60px;
}
.lp-divider {
    width: 1px;
    height: 60px;
    background: linear-gradient(to bottom, transparent, var(--gold), transparent);
    margin: 0 auto 60px;
}
.lp-copy {
    font-family: 'Shippori Mincho', serif;
    font-size: 1rem;
    line-height: 2.8;
    color: var(--white);
    text-align: center;
    max-width: 340px;
    margin: 0 auto 60px;
}
.lp-copy em { color: var(--gold2); font-style: normal; }
.btn-scan {
    display: block;
    margin: 0 auto;
    padding: 18px 48px;
    background: none;
    border: 1px solid var(--gold);
    color: var(--gold);
    font-family: 'Shippori Mincho', serif;
    font-size: 0.95rem;
    letter-spacing: 0.4em;
    cursor: pointer;
    position: relative;
    transition: all 0.4s ease;
}
.btn-scan::before, .btn-scan::after {
    content: '';
    position: absolute;
    width: 8px; height: 8px;
    border-color: var(--gold2);
    border-style: solid;
    transition: all 0.3s ease;
}
.btn-scan::before { top: -1px; left: -1px; border-width: 1px 0 0 1px; }
.btn-scan::after  { bottom: -1px; right: -1px; border-width: 0 1px 1px 0; }
.btn-scan:hover { background: rgba(201,168,76,0.08); box-shadow: var(--glow-gold); color: var(--gold2); }
.lp-warn {
    margin-top: 24px;
    font-size: 0.7rem;
    color: rgba(240,236,228,0.3);
    text-align: center;
    letter-spacing: 0.1em;
}

/* ─── スキャナー ─── */
#scanner-viewport {
    position: relative;
    width: 100vw;
    height: 100vh;
    background: #000;
}
video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
}
#iris-canvas { position: absolute; inset: 0; pointer-events: none; }
#scan-hud { position: absolute; inset: 0; pointer-events: none; }
.hud-corner { position: absolute; width: 24px; height: 24px; border-color: rgba(201,168,76,0.5); border-style: solid; }
.hud-corner.tl { top: 24px; left: 24px; border-width: 1px 0 0 1px; }
.hud-corner.tr { top: 24px; right: 24px; border-width: 1px 1px 0 0; }
.hud-corner.bl { bottom: 80px; left: 24px; border-width: 0 0 1px 1px; }
.hud-corner.br { bottom: 80px; right: 24px; border-width: 0 1px 1px 0; }
#progress-wrap { position: absolute; bottom: 32px; width: 80%; left: 10%; }
#progress-track { height: 1px; background: rgba(201,168,76,0.2); }
#progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(to right, var(--gold), var(--gold2));
    transition: width 0.3s ease;
    position: relative;
}
#progress-fill::after {
    content: '';
    position: absolute;
    right: 0; top: -3px;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--gold2);
    box-shadow: var(--glow-gold);
}
#progress-label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.65rem;
    color: var(--gold);
    margin-top: 10px;
    text-align: center;
    letter-spacing: 0.2em;
}

/* ─── 儀式オーバーレイ ─── */
/* ★ fixed + overflow-y:auto で31個全部表示 */
#ritual-overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 20px 12px 24px;
    background: rgba(0,0,0,0.88);
    backdrop-filter: blur(8px);
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.6s ease;
}
#ritual-overlay.active { opacity: 1; pointer-events: all; }

.ritual-title {
    font-family: 'Shippori Mincho', serif;
    color: var(--gold2);
    font-size: 1rem;
    letter-spacing: 0.2em;
    text-align: center;
    margin-bottom: 14px;
    text-shadow: var(--glow-gold);
    line-height: 1.8;
    flex-shrink: 0;
}

/* ドウェル進捗テキスト */
#dwell-indicator {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.7rem;
    color: var(--neon);
    letter-spacing: 0.25em;
    text-align: center;
    margin-bottom: 14px;
    height: 18px;
    flex-shrink: 0;
    opacity: 0;
    transition: opacity 0.2s;
}
#dwell-indicator.active { opacity: 1; }

/* 視線グリッド共通 */
.gaze-grid {
    display: grid;
    gap: 8px;
    width: 94%;
    justify-content: center;
    flex-shrink: 0;
}
.grid-blood {
    grid-template-columns: repeat(2, 1fr);
    max-width: 200px;
    gap: 14px;
}
.grid-month {
    grid-template-columns: repeat(4, 1fr);
    max-width: 300px;
}
/* ★ 日付：7列 × 5行 = 35マス（31個+空4） */
.grid-day {
    grid-template-columns: repeat(7, 1fr);
    max-width: 360px;
    gap: 5px;
}

.gaze-target {
    aspect-ratio: 1 / 1;
    border: 1px solid rgba(201,168,76,0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--gold);
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.95rem;
    position: relative;
    transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    background: rgba(201,168,76,0.03);
    user-select: none;
}
.grid-blood .gaze-target { font-size: 1.4rem; }
.grid-month .gaze-target { font-size: 0.9rem; }
.grid-day   .gaze-target { font-size: 0.75rem; }

.gaze-target.highlight {
    border-color: var(--neon);
    color: var(--white);
    box-shadow: 0 0 14px rgba(0,229,255,0.5);
    transform: scale(1.1);
    background: rgba(0,229,255,0.08);
    z-index: 10;
}

/* ドウェルプログレスバー（セル下端） */
.progress-fill-ring {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 2px;
    background: var(--neon);
    transform-origin: left;
    transform: scaleX(0);
    box-shadow: var(--glow-neon);
}

/* ─── ローディング ─── */
#phase-loading {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--deep);
}
.loading-text {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.7rem;
    color: var(--gold);
    letter-spacing: 0.3em;
    animation: blink 1.2s ease-in-out infinite;
}
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }

/* ─── 結果 ─── */
#phase-result { min-height: 100vh; background: var(--deep); }
#result-inner { padding: 60px 28px 80px; max-width: 480px; margin: 0 auto; }
.result-header {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.65rem;
    color: rgba(201,168,76,0.4);
    letter-spacing: 0.3em;
    text-align: center;
    margin-bottom: 40px;
}
.result-title {
    font-family: 'Shippori Mincho', serif;
    font-size: 1.6rem;
    color: var(--gold2);
    text-align: center;
    line-height: 1.6;
    text-shadow: var(--glow-gold);
    margin-bottom: 12px;
}
.result-identity {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.75rem;
    color: rgba(0,229,255,0.6);
    text-align: center;
    letter-spacing: 0.2em;
    margin-bottom: 40px;
}
.result-divider {
    width: 40px; height: 1px;
    background: linear-gradient(to right, transparent, var(--gold), transparent);
    margin: 0 auto 40px;
}
.result-story {
    font-family: 'Shippori Mincho', serif;
    font-size: 0.95rem;
    line-height: 3;
    color: var(--white);
    border-left: 1px solid rgba(201,168,76,0.2);
    padding-left: 20px;
}
.result-story em { color: var(--gold2); font-style: normal; }

/* ─── エラー ─── */
#error-banner {
    display: none;
    position: fixed;
    bottom: 20px; left: 50%;
    transform: translateX(-50%);
    background: rgba(200,50,50,0.9);
    color: #fff;
    padding: 12px 24px;
    font-size: 0.8rem;
    border-radius: 2px;
    z-index: 999;
    text-align: center;
    max-width: 90vw;
}
</style>
</head>
<body>
<div id="app">

    <!-- LP -->
    <div id="phase-landing" class="phase active">
        <p class="lp-deco">IRIS RESONANCE SYSTEM v2.1</p>
        <h1 class="lp-eyecatch">未来ノート</h1>
        <p class="lp-sub">瞳が知っている、あなたの物語</p>
        <div class="lp-divider"></div>
        <p class="lp-copy">
            生まれた日。<br>刻まれた血。<br>
            <em>あなたの瞳の奥に、</em><br>
            すでにすべての答えがある。<br>
            本当の物語を知る<em>勇気</em>がありますか？
        </p>
        <button class="btn-scan" id="start-btn">瞳をスキャンする</button>
        <p class="lp-warn">※ カメラへのアクセスが必要です。映像は外部に送信されません。</p>
    </div>

    <!-- スキャナー -->
    <div id="phase-scanner" class="phase">
        <div id="scanner-viewport">
            <video id="video" playsinline autoplay muted></video>
            <canvas id="iris-canvas"></canvas>
            <div id="scan-hud">
                <div class="hud-corner tl"></div>
                <div class="hud-corner tr"></div>
                <div class="hud-corner bl"></div>
                <div class="hud-corner br"></div>
            </div>
            <div id="progress-wrap">
                <div id="progress-track"><div id="progress-fill"></div></div>
                <p id="progress-label">INITIALIZING...</p>
            </div>
        </div>
        <!-- fixed配置の儀式オーバーレイ -->
        <div id="ritual-overlay">
            <h2 id="ritual-instruction" class="ritual-title"></h2>
            <div id="dwell-indicator">● LOCKING...</div>
            <div id="ritual-container" class="gaze-grid"></div>
        </div>
    </div>

    <!-- ローディング -->
    <div id="phase-loading" class="phase">
        <p class="loading-text">ANALYZING YOUR FATE...</p>
    </div>

    <!-- 結果 -->
    <div id="phase-result" class="phase">
        <div id="result-inner"></div>
    </div>
</div>

<div id="error-banner"></div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
<script>
/* ════ 定数 ════ */
const DWELL_TIME   = 3000;  // ★ 3秒（元2秒から変更）
const GRACE_PERIOD = 500;   // ★ 視線が外れてからリセットまでの猶予ms
const SCAN_START   = 30;

const GOLD = '#c9a84c';
const NEON = '#00e5ff';

/* ════ 状態 ════ */
const state = {
    phase: 'landing',
    ritualStep: null,
    currentTarget: null,
    gazeStartTime: 0,
    gazeLeaveTime: 0,   // ★ 視線が外れた時刻
    scanProgress: 0,
    results: { blood: '', month: '', day: '' }
};

const STEPS = ['blood', 'month', 'day'];

const DATA = {
    blood: ['A', 'B', 'O', 'AB'],
    month: Array.from({ length: 12 }, (_, i) => String(i + 1)),
    day:   Array.from({ length: 31 }, (_, i) => String(i + 1))
};

const LABELS = {
    blood: 'あなたの「血液型」を\n見つめてください',
    month: 'あなたの「誕生月」を\n見つめてください',
    day:   'あなたの「誕生日」を\n見つめてください'
};

/* ════ DOM ════ */
const video           = document.getElementById('video');
const canvas          = document.getElementById('iris-canvas');
const ctx             = canvas.getContext('2d');
const progressFill    = document.getElementById('progress-fill');
const progressLabel   = document.getElementById('progress-label');
const ritualOverlay   = document.getElementById('ritual-overlay');
const ritualInst      = document.getElementById('ritual-instruction');
const ritualContainer = document.getElementById('ritual-container');
const dwellInd        = document.getElementById('dwell-indicator');

/* ════ フェーズ切替 ════ */
function showPhase(id) {
    document.querySelectorAll('.phase').forEach(el => el.classList.remove('active'));
    document.getElementById('phase-' + id).classList.add('active');
}

/* ════ カメラ ════ */
document.getElementById('start-btn').addEventListener('click', async () => {
    showPhase('scanner');
    state.phase = 'scanning';
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }
        });
        video.srcObject = stream;
        await new Promise(res => { video.onloadedmetadata = res; });
        video.play();
        runFaceMesh();
    } catch (e) {
        const b = document.getElementById('error-banner');
        b.textContent = 'カメラへのアクセスを許可してください';
        b.style.display = 'block';
        setTimeout(() => { b.style.display = 'none'; }, 4000);
        showPhase('landing');
        state.phase = 'landing';
    }
});

/* ════ MediaPipe ════ */
function runFaceMesh() {
    const fm = new FaceMesh({
        locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}`
    });
    fm.setOptions({
        maxNumFaces: 1,
        refineLandmarks: true,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
    });
    fm.onResults(onResults);

    const loop = async () => {
        if (video.readyState >= 2) await fm.send({ image: video });
        requestAnimationFrame(loop);
    };
    loop();
}

function onResults(res) {
    const W = canvas.width  = window.innerWidth;
    const H = canvas.height = window.innerHeight;
    ctx.clearRect(0, 0, W, H);

    if (!res.multiFaceLandmarks?.length) {
        handleLeave(); return;
    }

    const iris = res.multiFaceLandmarks[0][468];
    const gx = (1 - iris.x) * W;
    const gy = iris.y * H;

    drawGuide(gx, gy);

    if (state.phase === 'scanning') {
        state.scanProgress = Math.min(state.scanProgress + 0.4, 100);
        const pct = Math.floor(state.scanProgress);
        progressFill.style.width = pct + '%';
        progressLabel.textContent = `IRIS SCANNING... ${pct}%`;
        if (state.scanProgress >= SCAN_START) {
            state.phase = 'ritual';
            startStep('blood');
        }
    } else if (state.phase === 'ritual') {
        handleGaze(gx, gy);
    }
}

/* ════ 視線判定（グレース期間付き）════ */
function handleGaze(gx, gy) {
    const el     = document.elementFromPoint(gx, gy);
    const target = el?.closest('.gaze-target');

    if (target) {
        state.gazeLeaveTime = 0; // ターゲット上にいる間はリセット時刻をクリア

        if (state.currentTarget === target) {
            // 同じターゲットを見続けている
            const elapsed = Date.now() - state.gazeStartTime;
            const ratio   = Math.min(elapsed / DWELL_TIME, 1);
            setBar(target, ratio);
            setIndicator(ratio);
            if (elapsed >= DWELL_TIME) confirmSelection(target.dataset.value);
        } else {
            // 別のターゲットに視線が移った
            clearHighlight();
            state.currentTarget  = target;
            state.gazeStartTime  = Date.now();
            target.classList.add('highlight');
        }
    } else {
        handleLeave();
    }
}

function handleLeave() {
    if (!state.currentTarget) return;

    if (state.gazeLeaveTime === 0) {
        state.gazeLeaveTime = Date.now();           // 離れた時刻を記録
    } else if (Date.now() - state.gazeLeaveTime > GRACE_PERIOD) {
        clearHighlight();                            // 猶予超えたらリセット
    }
    // 猶予内ならプログレスを維持（ジッター対策）
}

function clearHighlight() {
    if (state.currentTarget) {
        state.currentTarget.classList.remove('highlight');
        setBar(state.currentTarget, 0);
        state.currentTarget = null;
    }
    state.gazeLeaveTime = 0;
    dwellInd.classList.remove('active');
}

function setBar(target, ratio) {
    const bar = target.querySelector('.progress-fill-ring');
    if (bar) bar.style.transform = `scaleX(${ratio})`;
}

function setIndicator(ratio) {
    if (ratio > 0.05) {
        dwellInd.classList.add('active');
        dwellInd.textContent = `● LOCKING... ${Math.floor(ratio * 100)}%`;
    } else {
        dwellInd.classList.remove('active');
    }
}

/* ════ 儀式ステップ ════ */
function startStep(step) {
    state.ritualStep    = step;
    state.currentTarget = null;
    state.gazeLeaveTime = 0;

    ritualContainer.innerHTML   = '';
    ritualContainer.className   = `gaze-grid grid-${step}`;

    DATA[step].forEach(item => {
        const div           = document.createElement('div');
        div.className       = 'gaze-target';
        div.dataset.value   = item;
        div.innerHTML       = `<span>${item}</span><div class="progress-fill-ring"></div>`;
        ritualContainer.appendChild(div);
    });

    ritualInst.innerHTML = LABELS[step].replace('\n', '<br>');
    dwellInd.classList.remove('active');
    ritualOverlay.classList.add('active');
    ritualOverlay.scrollTop = 0;
}

function confirmSelection(value) {
    clearHighlight();
    state.results[state.ritualStep] = value;

    const next = STEPS[STEPS.indexOf(state.ritualStep) + 1];
    if (next) {
        startStep(next);
    } else {
        ritualOverlay.classList.remove('active');
        state.phase = 'loading';
        showPhase('loading');
        setTimeout(() => { showPhase('result'); renderResult(); }, 2200);
    }
}

/* ════ 虹彩ガイド描画（CSS変数は使わない）════ */
function drawGuide(x, y) {
    const r = 22;
    ctx.globalAlpha = 0.7;

    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.strokeStyle = GOLD; ctx.lineWidth = 1; ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(x - r - 6, y); ctx.lineTo(x - r + 4, y);
    ctx.moveTo(x + r - 4, y); ctx.lineTo(x + r + 6, y);
    ctx.moveTo(x, y - r - 6); ctx.lineTo(x, y - r + 4);
    ctx.moveTo(x, y + r - 4); ctx.lineTo(x, y + r + 6);
    ctx.strokeStyle = GOLD; ctx.lineWidth = 0.8; ctx.stroke();

    ctx.beginPath();
    ctx.arc(x, y, 3, 0, Math.PI * 2);
    ctx.fillStyle = NEON; ctx.globalAlpha = 0.9; ctx.fill();
    ctx.globalAlpha = 1;
}

/* ════ 結果 ════ */
function renderResult() {
    const { blood, month, day } = state.results;
    document.getElementById('result-inner').innerHTML = `
        <div class="result-header">IRIS RESONANCE — ANALYSIS COMPLETE</div>
        <h2 class="result-title">照合完了</h2>
        <p class="result-identity">${blood}型 / ${month}月${day}日生まれ</p>
        <div class="result-divider"></div>
        <div class="result-story">
            <p>私は、孤独だった。</p>
            <p>でもそれに気づいたのは、<em>星を見つけてから</em>だ。</p>
            <p>（${blood}型・${month}月${day}日生まれのストーリー本文をここに）</p>
        </div>
    `;
}
</script>
</body>
</html>
