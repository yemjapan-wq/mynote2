<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Potential Data Scanner V6</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <style>
        :root {
            --bg-color: #000;
            --accent: #00ff88;
            --neon-blue: #00e5ff;
            --neon-pink: #ff007f;
            --font-sys: 'Courier New', Courier, monospace;
        }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg-color); color: var(--accent); font-family: var(--font-sys); overflow: hidden; }
        
        #camera-container { position: absolute; inset: 0; z-index: 1; transition: transform 2s cubic-bezier(0.5, 0, 0.2, 1), opacity 1.5s; transform-origin: 50% 50%; }
        .input_video { display: none; }
        .output_canvas { width: 100%; height: 100%; object-fit: cover; opacity: 0.8; }
        
        .screen { position: absolute; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.85); transition: opacity 0.5s; }
        .hidden { opacity: 0; pointer-events: none !important; }
        
        h1 { font-size: 1.2rem; letter-spacing: 5px; text-shadow: 0 0 10px var(--accent); margin-bottom: 30px; }
        .btn { padding: 15px 40px; border: 1px solid var(--accent); background: rgba(0,255,136,0.1); color: var(--accent); cursor: pointer; letter-spacing: 3px; }

        /* Scanning UI */
        #hud-overlay { position: absolute; inset: 0; z-index: 5; pointer-events: none; }
        #scan-progress-bar { position: absolute; bottom: 15%; left: 50%; transform: translateX(-50%); width: 200px; height: 2px; background: rgba(255,255,255,0.1); }
        #scan-progress-fill { height: 100%; width: 0%; background: var(--accent); box-shadow: 0 0 10px var(--accent); transition: width 0.1s; }

        /* Transition */
        #flash { position: absolute; inset: 0; background: #fff; z-index: 100; opacity: 0; pointer-events: none; }

        /* Word Space */
        #word-container { position: absolute; inset: 0; z-index: 20; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(4, 1fr); background: #000; padding: 20px; }
        .word-cell { display: flex; align-items: center; justify-content: center; }
        .word { font-size: 1.8rem; color: #fff; font-family: sans-serif; font-weight: 200; letter-spacing: 4px; opacity: 0; animation: fadeWord 1.2s forwards; }
        @keyframes fadeWord { to { opacity: 1; } }

        /* Clinical Result */
        #screen-result { justify-content: flex-start; padding: 40px 20px; overflow-y: auto; background: #000; z-index: 150; }
        .result-box { width: 100%; max-width: 450px; text-align: left; }
        .data-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 30px; }
        .data-card { border: 1px solid #222; padding: 10px; background: #050505; }
        .data-label { font-size: 0.6rem; color: #666; margin-bottom: 5px; }
        .data-val { font-size: 0.9rem; color: var(--accent); }
        .section-title { font-size: 0.7rem; color: var(--neon-blue); border-bottom: 1px solid #222; padding-bottom: 5px; margin: 20px 0 10px; }
        .factor-word { font-size: 1.2rem; color: #fff; margin-bottom: 5px; border-left: 3px solid var(--accent); padding-left: 10px; }
        .factor-desc { font-size: 0.8rem; color: #999; line-height: 1.6; margin-bottom: 15px; }
    </style>
</head>
<body>

<div id="container">
    <div id="camera-container">
        <video class="input_video" playsinline></video>
        <canvas class="output_canvas"></canvas>
    </div>
    
    <div id="hud-overlay" class="hidden">
        <div id="scan-progress-bar"><div id="scan-progress-fill"></div></div>
    </div>

    <div id="word-container" class="hidden"></div>
    <div id="flash"></div>

    <div id="screen-boot" class="screen">
        <h1>NEURAL DIVE</h1>
        <p style="text-align:center; color:#666; font-size:0.8rem;">瞳をスキャンし、深層意識の宇宙へダイブします。</p>
        <button class="btn" onclick="startSystem()">INITIALIZE</button>
    </div>

    <div id="screen-result" class="screen hidden">
        <h1>DECODED LOG</h1>
        <div class="result-box">
            <div class="data-grid">
                <div class="data-card"><div class="data-label">IRIS COLOR</div><div class="data-val" id="res-iris">---</div></div>
                <div class="data-card"><div class="data-label">SYMMETRY</div><div class="data-val" id="res-asym">---</div></div>
            </div>
            
            <div class="section-title">DETECTIONS</div>
            <div id="res-list"></div>

            <div class="section-title">FINAL ARCHETYPE</div>
            <div id="res-type" style="font-size:1.5rem; color:var(--neon-blue);">---</div>
            <button class="btn" style="width:100%; margin-top:30px;" onclick="location.reload()">再試行</button>
        </div>
    </div>
</div>

<script>
    const wordData = {
        "自由": { front: "解放と自己決定", back: "責任の放棄と孤独への予感" },
        "富": { front: "物質的安定", back: "愛されない恐怖の代償" },
        "愛": { front: "精神的結合", back: "自己欠損を埋める飢餓" },
        "成功": { front: "自己実現", back: "敗北による存在消滅の恐怖" },
        "変革": { front: "現状打破", back: "過去の自分への強い嫌悪" },
        "支配": { front: "環境掌握", back: "無力感への反動的衝動" },
        "孤独": { back: "社会から断絶される根源的恐怖" },
        "崩壊": { back: "すべてを無に帰したい破壊願望" },
        "依存": { back: "一人では存在を維持できない寄生" },
        "再生": { back: "死への恐怖が反転した生への執着" },
        "混沌": { back: "秩序への限界と原始的衝動の爆発" },
        "深淵": { back: "内なる狂気に対する恐れと誘惑" }
    };
    const wordSets = [["自由","富","愛","成功","変革","支配"],["孤独","崩壊","依存","再生","混沌","深淵"]];

    let wordScores = {};
    const video = document.querySelector('.input_video');
    const canvas = document.querySelector('.output_canvas');
    const ctx = canvas.getContext('2d');
    const faceMesh = new FaceMesh({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`});
    
    let state = 'boot';
    let currentRound = 0;
    let progress = 0;
    let eyeTarget = {x:50, y:50, r:20};

    faceMesh.setOptions({maxNumFaces:1, refineLandmarks:true, minDetectionConfidence:0.5, minTrackingConfidence:0.5});
    faceMesh.onResults(onResults);

    function startSystem() {
        document.getElementById('screen-boot').classList.add('hidden');
        new Camera(video, { onFrame: async () => { await faceMesh.send({image: video}); }, width: 640, height: 480 }).start().then(() => {
            state = 'scanning';
            document.getElementById('hud-overlay').classList.remove('hidden');
        });
    }

    function onResults(res) {
        if (state === 'result') return;
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        ctx.clearRect(0,0,canvas.width,canvas.height);

        if (res.multiFaceLandmarks && res.multiFaceLandmarks[0]) {
            const lms = res.multiFaceLandmarks[0];
            const lc = lms[468]; 
            eyeTarget = { x: lc.x * canvas.width, y: lc.y * canvas.height, r: Math.abs(lms[469].x - lms[471].x) * canvas.width * 2 };

            if (state === 'scanning') {
                drawIrisHUD(eyeTarget.x, eyeTarget.y, eyeTarget.r);
                progress += 0.4;
                document.getElementById('scan-progress-fill').style.width = `${progress}%`;
                if (progress >= 100) startDive();
            }

            if (state === 'sampling') {
                // 視線トラッキング
                const nose = lms[1];
                const cx = window.innerWidth/2 + (nose.x - 0.5) * window.innerWidth * -5;
                const cy = window.innerHeight/2 + (nose.y - 0.5) * window.innerHeight * 5;
                checkWords(cx, cy);
            }
        }
    }

    function drawIrisHUD(cx, cy, r) {
        const t = Date.now() * 0.002;
        ctx.save();
        ctx.translate(cx, cy);
        
        // メインリング
        ctx.strokeStyle = 'rgba(0, 255, 136, 0.5)';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(0,0, r * 1.5, 0, Math.PI*2); ctx.stroke();

        // 未来ノート風：回転する目盛り
        ctx.rotate(t);
        for(let i=0; i<8; i++) {
            ctx.rotate(Math.PI/4);
            ctx.beginPath(); ctx.moveTo(r*1.8, 0); ctx.lineTo(r*2.1, 0);
            ctx.strokeStyle = i%2===0 ? varColor('--accent') : 'rgba(0,255,136,0.2)';
            ctx.stroke();
        }
        
        // ターゲット
        ctx.restore();
        ctx.strokeStyle = varColor('--accent');
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(cx,cy, 5, 0, Math.PI*2); ctx.stroke();
    }

    function varColor(name) { return getComputedStyle(document.documentElement).getPropertyValue(name); }

    function startDive() {
        state = 'dive';
        document.getElementById('hud-overlay').classList.add('hidden');
        const container = document.getElementById('camera-container');
        container.style.transformOrigin = `${(eyeTarget.x/canvas.width)*100}% ${(eyeTarget.y/canvas.height)*100}%`;
        container.style.transform = 'scale(50)';
        
        setTimeout(() => {
            document.getElementById('flash').style.opacity = 1;
            setTimeout(() => {
                container.style.display = 'none';
                document.getElementById('word-container').classList.remove('hidden');
                document.getElementById('flash').style.opacity = 0;
                state = 'sampling';
                startSampling();
            }, 600);
        }, 1000);
    }

    function startSampling() {
        if (currentRound >= 2) { finish(); return; }
        renderWords(wordSets[currentRound]);
        setTimeout(() => { currentRound++; startSampling(); }, 6000);
    }

    function renderWords(set) {
        const c = document.getElementById('word-container');
        c.innerHTML = '';
        set.forEach(w => {
            const cell = document.createElement('div'); cell.className='word-cell';
            const el = document.createElement('div'); el.className='word'; el.innerText=w;
            cell.appendChild(el); c.appendChild(cell);
            wordScores[w] = 0;
        });
    }

    function checkWords(cx, cy) {
        document.querySelectorAll('.word').forEach(el => {
            const r = el.getBoundingClientRect();
            const dist = Math.hypot(cx - (r.left+r.width/2), cy - (r.top+r.height/2));
            if (dist < 100) wordScores[el.innerText]++;
        });
    }

    function finish() {
        state = 'result';
        document.getElementById('word-container').classList.add('hidden');
        const sorted = Object.entries(wordScores).sort((a,b)=>b[1]-a[1]);
        
        document.getElementById('res-iris').innerText = "深碧 (Deep Emerald)";
        document.getElementById('res-asym').innerText = "0.8% (高対称)";
        document.getElementById('res-type').innerText = "Type: 21-Omega";
        
        const list = document.getElementById('res-list');
        sorted.slice(0,3).forEach(([w, s]) => {
            const d = wordData[w];
            list.innerHTML += `<div class="factor-word">${w}</div><div class="factor-desc"><b>[意識]</b> ${d.front || '潜在的反応'}<br><b>[深層]</b> ${d.back}</div>`;
        });
        document.getElementById('screen-result').classList.remove('hidden');
    }
</script>
</body>
</html>
