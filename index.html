<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Potential Data Scanner v2</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <style>
        :root {
            --bg-color: #050505;
            --text-main: #e0e0e0;
            --accent: #00ff88;
        }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--bg-color); color: var(--text-main);
            font-family: 'Helvetica Neue', Arial, sans-serif;
            overflow: hidden; user-select: none;
        }
        #container { position: relative; width: 100%; height: 100%; }
        
        .input_video { display: none; }
        .output_canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0.2; object-fit: cover; z-index: 1; pointer-events: none; }
        
        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(5,5,5,0.9); transition: opacity 0.8s; }
        .hidden { opacity: 0; pointer-events: none; }
        
        h1 { font-size: 1.1rem; font-weight: 200; letter-spacing: 4px; color: var(--accent); margin-bottom: 30px; text-transform: uppercase; }
        p { font-size: 0.9rem; line-height: 1.8; text-align: center; max-width: 80%; color: #aaa; }
        
        /* 文字の巨大化と静寂 */
        #word-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; }
        .word { 
            position: absolute; 
            font-size: 1.8rem; /* 大きく */
            color: #444; /* 最初から一定の暗さ */
            transform: translate(-50%, -50%); 
            transition: opacity 0.5s;
            letter-spacing: 2px;
        }

        .btn { margin-top: 40px; padding: 12px 40px; border: 1px solid #444; background: transparent; color: #888; font-family: inherit; font-size: 0.8rem; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; }
        .btn:hover { border-color: var(--accent); color: var(--accent); }
        
        /* 結果画面の構成 */
        .result-box { width: 85%; max-width: 400px; text-align: left; border-top: 1px solid #333; padding-top: 20px; }
        .protocol-label { font-size: 0.7rem; color: var(--accent); opacity: 0.7; margin-bottom: 5px; }
        .protocol-name { font-size: 1.4rem; margin-bottom: 20px; font-weight: 300; }
        .analysis-text { font-size: 0.85rem; line-height: 1.8; color: #bbb; margin-bottom: 20px; text-align: justify; }
        .stats { font-size: 0.7rem; color: #666; display: flex; justify-content: space-between; margin-bottom: 5px; }
    </style>
</head>
<body>

<div id="container">
    <video class="input_video" playsinline></video>
    <canvas class="output_canvas"></canvas>
    
    <div id="word-container"></div>

    <!-- Phase 1: Boot -->
    <div id="screen-boot" class="screen">
        <h1>Analysis Protocol</h1>
        <p>視線ベクトルのサンプリングにより、<br>現在の精神構造を客観的に記述します。</p>
        <button class="btn" onclick="startSystem()">計測開始</button>
    </div>

    <!-- Phase 3: Results -->
    <div id="screen-result" class="screen hidden">
        <h1>Result Data</h1>
        <div class="result-box">
            <div class="protocol-label">IDENTIFIED PROTOCOL</div>
            <div class="protocol-name" id="res-type">Type: 14-Delta</div>
            
            <div class="protocol-label">DESCRIPTION</div>
            <div class="analysis-text" id="res-desc">
                <!-- ここに説明文が入る -->
            </div>

            <div class="stats"><span>Compatibility</span><span id="res-percent">0.0%</span></div>
            <div class="stats"><span>Dominant Factor</span><span id="res-high" style="color:#888">---</span></div>
            <div class="stats"><span>Suppressed Factor</span><span id="res-low" style="color:#888">---</span></div>
        </div>
        <button class="btn" onclick="window.location.href='#'">詳細な総括を確認する</button>
    </div>
</div>

<script>
    const wordSets = [
        ["自由", "富", "愛", "成功", "変革", "承認", "安息", "支配", "情熱", "知識", "美", "調和"],
        ["孤独", "停滞", "虚無", "裏切り", "束縛", "喪失", "凡庸", "依存", "崩壊", "嫉妬", "忘却", "静止"],
        ["覚醒", "決別", "原点", "超越", "開錠", "再生", "混沌", "境界", "導き", "共鳴", "深淵", "使命"]
    ];

    // 21の属性に合わせた説明文の辞書 (一部抜粋・プロトタイプ用)
    const descriptions = {
        "Type: 01-Alpha": "この状態は、外部からの干渉を排し、純粋な理論的整合性を求める傾向にある。他者からの承認よりも自己完結した真理に重きを置く、静かなる観測者のフェーズである。",
        "Type: 07-Sigma": "現状の枠組みに対する強い不全感と、それを打破しようとする破壊的衝動が混在している。リスクを厭わず、未知の領域に自己を投じる準備が整った変革の兆しを示している。",
        "Type: 14-Delta": "他者との共鳴や調和を深く渇望する一方で、根源的な孤独に対する鋭い回避反応が検出された。自己を他者の輪郭に溶け込ませることで安寧を得ようとする防衛的渇望の状態にある。",
        "Type: 21-Omega": "混沌の中に秩序を見出し、複雑な状況を統制しようとする意志が潜在している。一見すると停滞しているように見えるが、内側では巨大な力の再構築が行われている支配的潜伏期である。"
    };

    let wordScores = {}; 
    const videoElement = document.querySelector('.input_video');
    const canvasElement = document.querySelector('.output_canvas');
    const faceMesh = new FaceMesh({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`});
    
    let isScanning = false;
    let currentRound = 0;
    let activeWords = [];
    let cursorX = 0, cursorY = 0;
    let baseNoseX = null, baseNoseY = null;

    faceMesh.setOptions({refineLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5});
    faceMesh.onResults(onResults);

    function startSystem() {
        document.getElementById('screen-boot').classList.add('hidden');
        new Camera(videoElement, {
            onFrame: async () => { await faceMesh.send({image: videoElement}); },
            width: 640, height: 480
        }).start().then(() => {
            setTimeout(startSampling, 2000);
        });
    }

    function onResults(results) {
        if (!results.multiFaceLandmarks || results.multiFaceLandmarks.length === 0) return;
        const landmarks = results.multiFaceLandmarks[0];
        
        // 視線計算（ポインターは表示しないが計算は継続）
        const nose = landmarks[1];
        if(!baseNoseX) { baseNoseX = nose.x; baseNoseY = nose.y; }
        const sensitivity = 3.5;
        cursorX = window.innerWidth / 2 + ((nose.x - baseNoseX) * window.innerWidth * sensitivity * -1);
        cursorY = window.innerHeight / 2 + ((nose.y - baseNoseY) * window.innerHeight * sensitivity);

        if (isScanning) checkWordIntersection();
    }

    function startSampling() {
        if(currentRound >= 3) { finishAnalysis(); return; }
        displayWords(wordSets[currentRound]);
        isScanning = true;
        setTimeout(() => {
            isScanning = false;
            currentRound++;
            startSampling();
        }, 8000); // 1画面8秒に短縮してテンポアップ
    }

    function displayWords(words) {
        const container = document.getElementById('word-container');
        container.innerHTML = '';
        activeWords = [];
        words.forEach(wordText => {
            const x = 20 + Math.random() * 60;
            const y = 20 + Math.random() * 60;
            const el = document.createElement('div');
            el.className = 'word';
            el.innerText = wordText;
            el.style.left = `${x}%`;
            el.style.top = `${y}%`;
            container.appendChild(el);
            if(!wordScores[wordText]) wordScores[wordText] = 0;
            activeWords.push({ element: el, text: wordText, rect: el.getBoundingClientRect() });
        });
        setTimeout(() => {
            activeWords.forEach(w => w.rect = w.element.getBoundingClientRect());
        }, 100);
    }

    function checkWordIntersection() {
        activeWords.forEach(w => {
            if(!w.rect) return;
            const cx = w.rect.left + w.rect.width / 2;
            const cy = w.rect.top + w.rect.height / 2;
            const dist = Math.hypot(cursorX - cx, cursorY - cy);
            if(dist < 80) wordScores[w.text] += 1; // 判定範囲を少し広げて確実に拾う
        });
    }

    function finishAnalysis() {
        document.getElementById('word-container').innerHTML = '';
        const sorted = Object.entries(wordScores).sort((a, b) => b[1] - a[1]);
        const highest = sorted.slice(0, 2).map(w => w[0]).join(" / ");
        const lowest = sorted.slice(-2).map(w => w[0]).join(" / ");

        const types = Object.keys(descriptions);
        const randomType = types[Math.floor(Math.random() * types.length)];
        
        document.getElementById('res-type').innerText = randomType;
        document.getElementById('res-desc').innerText = descriptions[randomType];
        document.getElementById('res-percent').innerText = (85 + Math.random() * 10).toFixed(1) + "%";
        document.getElementById('res-high').innerText = highest || "計測不能";
        document.getElementById('res-low').innerText = lowest || "計測不能";

        document.getElementById('screen-result').classList.remove('hidden');
    }
</script>
</body>
</html>
