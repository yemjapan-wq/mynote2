<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>NEURAL DIVE — 潜在意識解析エンジン</title>
<style>
/* ============================================================
   RESET & VARIABLES
============================================================ */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --c: #00ff41;          /* neon green */
  --p: #ff2d78;          /* neon pink */
  --b: #00f5ff;          /* neon cyan/blue */
  --y: #ffe600;          /* neon yellow */
  --bg: #000000;
  --dim: rgba(0,245,255,.08);
}

html, body {
  width: 100vw; height: 100vh;
  overflow: hidden;
  background: var(--bg);
  color: var(--c);
  font-family: 'Courier New', Courier, monospace;
  -webkit-text-size-adjust: none;
  user-select: none;
  -webkit-user-select: none;
  cursor: none;
}

/* CRT scanline overlay */
body::before {
  content: '';
  position: fixed; inset: 0; z-index: 9999;
  background: repeating-linear-gradient(
    0deg,
    transparent 0px,
    transparent 2px,
    rgba(0,0,0,.06) 2px,
    rgba(0,0,0,.06) 4px
  );
  pointer-events: none;
}

/* ============================================================
   SCREEN MANAGEMENT
============================================================ */
.screen {
  position: fixed; inset: 0;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 10;
}
.screen.active { display: flex; }

/* ============================================================
   BOOT SCREEN
============================================================ */
#screen-boot { background: #000; gap: 0; }

.boot-logo {
  font-size: clamp(32px,9vw,72px);
  font-weight: 900;
  letter-spacing: .35em;
  color: var(--b);
  text-shadow: 0 0 8px var(--b), 0 0 25px var(--b), 0 0 60px rgba(0,245,255,.4);
  animation: flicker 5s ease-in-out infinite;
  margin-bottom: 4px;
}
.boot-sub {
  font-size: clamp(7px,2vw,11px);
  letter-spacing: .5em;
  color: var(--p);
  text-shadow: 0 0 8px var(--p);
  margin-bottom: 32px;
}
.boot-log {
  width: min(90vw,480px);
  font-size: clamp(9px,2.2vw,12px);
  color: #444;
  line-height: 1.9;
  text-align: left;
  min-height: 200px;
}
.boot-line { opacity: 0; animation: fadein .05s forwards; }
.boot-line.ok::after  { content: ' [OK]';      color: var(--c); }
.boot-line.warn::after { content: ' [CAUTION]'; color: #ff9500; }
.boot-line.err::after  { content: ' [ANOMALY]'; color: var(--p); }

#boot-btn {
  margin-top: 28px;
  padding: 13px 44px;
  background: transparent;
  border: 1px solid var(--b);
  color: var(--b);
  font-family: inherit;
  font-size: clamp(11px,2.5vw,14px);
  letter-spacing: .35em;
  cursor: pointer;
  text-shadow: 0 0 8px var(--b);
  box-shadow: 0 0 16px rgba(0,245,255,.2), inset 0 0 12px rgba(0,245,255,.05);
  opacity: 0;
  transition: opacity .4s, box-shadow .3s, background .3s;
}
#boot-btn.visible { opacity: 1; }
#boot-btn:hover {
  background: rgba(0,245,255,.08);
  box-shadow: 0 0 30px var(--b), inset 0 0 20px rgba(0,245,255,.1);
}

/* ============================================================
   SCAN SCREEN
============================================================ */
#screen-scan { background: #000; }

#scan-video {
  position: fixed; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  opacity: .55;
  transform: scaleX(-1);
  z-index: 1;
}
#hud-canvas {
  position: fixed; inset: 0;
  width: 100%; height: 100%;
  z-index: 2;
  pointer-events: none;
}
.scan-ui {
  position: fixed; inset: 0;
  z-index: 3;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  padding: 5vh 6vw 8vh;
  pointer-events: none;
}
.scan-top { text-align: center; }
.scan-title {
  font-size: clamp(14px,3.5vw,22px);
  letter-spacing: .55em;
  color: var(--b);
  text-shadow: 0 0 12px var(--b);
}
#scan-status {
  font-size: clamp(9px,2vw,12px);
  letter-spacing: .35em;
  color: var(--c);
  text-shadow: 0 0 6px var(--c);
  margin-top: 6px;
  min-height: 18px;
}
.scan-bottom { width: 100%; }
.pbar-bg {
  width: 100%;
  height: 1px;
  background: #111;
}
.pbar-fill {
  height: 100%;
  width: 0%;
  background: var(--b);
  box-shadow: 0 0 8px var(--b);
  transition: width .12s linear;
}
#scan-pct {
  text-align: center;
  font-size: clamp(8px,1.8vw,10px);
  color: rgba(0,245,255,.4);
  letter-spacing: .4em;
  margin-top: 6px;
}

/* corner brackets */
.corners { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
.corner {
  position: absolute;
  width: 22px; height: 22px;
  border-color: rgba(0,245,255,.5);
  border-style: solid;
}
.corner.tl { top: 12px; left: 12px; border-width: 1px 0 0 1px; }
.corner.tr { top: 12px; right: 12px; border-width: 1px 1px 0 0; }
.corner.bl { bottom: 12px; left: 12px; border-width: 0 0 1px 1px; }
.corner.br { bottom: 12px; right: 12px; border-width: 0 1px 1px 0; }

/* ============================================================
   DIVE TRANSITION
============================================================ */
#screen-dive { background: #000; z-index: 50; }
#dive-canvas { position: fixed; inset: 0; width: 100%; height: 100%; }

/* ============================================================
   SAMPLE SCREEN
============================================================ */
#screen-sample { background: #000; cursor: none; }

#sample-video {
  position: fixed;
  width: 1px; height: 1px;
  left: -100px; top: -100px;
  opacity: 0;
  z-index: -1;
}

#word-grid {
  position: fixed; inset: 0;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-template-rows: repeat(3, 1fr);
  padding: 12vh 6vw;
  gap: 0;
  transition: opacity 0.5s ease;
}
.wc {
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: clamp(22px,6.5vw,52px);
  font-weight: 900;
  color: rgba(255,255,255,.92);
  letter-spacing: .04em;
  transition: none;
  animation: wfloat var(--fd,4s) ease-in-out infinite;
  animation-delay: var(--dd,0s);
}

#sample-hdr {
  position: fixed;
  top: 2vh; left: 50%; transform: translateX(-50%);
  z-index: 5; pointer-events: none;
  font-size: clamp(7px,1.5vw,9px);
  letter-spacing: .5em;
  color: #1a1a1a;
  white-space: nowrap;
}

#timer-bar {
  position: fixed;
  bottom: 0; left: 0;
  width: 100%; height: 2px;
  background: #0a0a0a;
  z-index: 5;
}
#timer-fill {
  height: 100%;
  width: 100%;
  background: var(--p);
  box-shadow: 0 0 6px var(--p);
  transform-origin: left;
  transition: width .5s linear;
}

/* ============================================================
   RESULT SCREEN
============================================================ */
#screen-result {
  background: #000;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  align-items: flex-start;
  justify-content: flex-start;
}
#screen-result::-webkit-scrollbar { width: 2px; }
#screen-result::-webkit-scrollbar-track { background: #000; }
#screen-result::-webkit-scrollbar-thumb { background: rgba(0,245,255,.2); }

.rc {
  width: 100%;
  max-width: 640px;
  margin: 0 auto;
  padding: 7vh 6vw 80px;
}

.r-hdr { text-align: center; margin-bottom: 32px; }
.r-sid {
  font-size: clamp(7px,1.6vw,9px);
  color: #3a3a3a;
  letter-spacing: .5em;
  margin-bottom: 6px;
}
.r-type {
  font-size: clamp(26px,7vw,52px);
  font-weight: 900;
  color: var(--b);
  text-shadow: 0 0 16px var(--b), 0 0 40px rgba(0,245,255,.5);
  letter-spacing: .2em;
  line-height: 1;
}
.r-arch {
  font-size: clamp(11px,2.8vw,16px);
  color: var(--p);
  text-shadow: 0 0 8px var(--p);
  letter-spacing: .25em;
  margin-top: 6px;
}

.r-section {
  margin: 24px 0;
  padding-left: 14px;
  border-left: 1px solid #0f0f0f;
}
.r-stitle {
  font-size: clamp(7px,1.6vw,9px);
  letter-spacing: .55em;
  color: #4a4a4a;
  margin-bottom: 14px;
  text-transform: uppercase;
}

.fi { margin: 14px 0; }
.fi-word {
  font-size: clamp(15px,4vw,22px);
  font-weight: 900;
  color: var(--c);
  text-shadow: 0 0 8px rgba(0,255,65,.5);
  letter-spacing: .05em;
}
.fi-f {
  font-size: clamp(9px,2.2vw,12px);
  color: #c0c0c0;
  margin-top: 3px;
  line-height: 1.5;
}
.fi-f::before { content: '▸ '; color: #666; }
.fi-b {
  font-size: clamp(9px,2.2vw,12px);
  color: var(--p);
  opacity: .8;
  margin-top: 2px;
  line-height: 1.5;
}
.fi-b::before { content: '▾ '; color: #441122; }

.r-sup .fi-word { color: #555; text-shadow: none; }
.r-sup .fi-f    { color: #777; }
.r-sup .fi-b    { color: #8a3050; }

.phys {
  border: 1px solid #161616;
  padding: 16px;
  margin: 20px 0;
  font-size: clamp(8px,2vw,11px);
  line-height: 2.1;
  color: #888;
  letter-spacing: .08em;
}
.phys span { color: var(--b); }

.compat { text-align: center; margin: 28px 0 20px; }
.compat-n {
  font-size: clamp(40px,12vw,80px);
  font-weight: 900;
  color: var(--p);
  text-shadow: 0 0 20px var(--p), 0 0 50px rgba(255,45,120,.4);
  line-height: 1;
}
.compat-l {
  font-size: clamp(7px,1.8vw,9px);
  color: #666;
  letter-spacing: .55em;
  margin-top: 5px;
}

.r-desc {
  font-size: clamp(9px,2.2vw,12px);
  color: #d0d0d0;
  line-height: 2;
  margin: 16px 0 24px;
  letter-spacing: .05em;
}
.r-desc .hi { color: var(--c); }
.r-desc .lo { color: #666; }

.cta-box {
  border: 1px solid rgba(0,245,255,.12);
  padding: 24px 20px;
  margin: 24px 0;
  position: relative;
  overflow: hidden;
  text-align: center;
}
.cta-box::after {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse 60% 60% at 50% 50%, rgba(0,245,255,.04), transparent);
  pointer-events: none;
}
.cta-lbl {
  font-size: clamp(7px,1.6vw,9px);
  letter-spacing: .55em;
  color: #555;
  margin-bottom: 10px;
}
.cta-txt {
  font-size: clamp(10px,2.3vw,13px);
  color: #d0d0d0;
  line-height: 1.9;
  margin-bottom: 18px;
}
.cta-txt strong { color: var(--y); text-shadow: 0 0 8px rgba(255,230,0,.4); }
.cta-txt em { color: #888; font-style: normal; font-size: .9em; }

.cta-btn {
  display: inline-block;
  padding: 14px 36px;
  background: transparent;
  border: 1px solid var(--b);
  color: var(--b);
  font-family: inherit;
  font-size: clamp(10px,2.3vw,13px);
  letter-spacing: .3em;
  cursor: pointer;
  text-decoration: none;
  text-shadow: 0 0 8px var(--b);
  box-shadow: 0 0 12px rgba(0,245,255,.2);
  transition: all .3s;
  position: relative;
  z-index: 1;
}
.cta-btn:hover { background: rgba(0,245,255,.08); box-shadow: 0 0 28px var(--b); }

.retry-btn {
  display: block;
  width: 100%;
  margin-top: 12px;
  padding: 12px;
  background: transparent;
  border: 1px solid #111;
  color: #222;
  font-family: inherit;
  font-size: clamp(8px,1.8vw,10px);
  letter-spacing: .3em;
  cursor: pointer;
  transition: all .3s;
}
.retry-btn:hover { color: #444; border-color: #333; }

/* ============================================================
   KEYFRAMES
============================================================ */
@keyframes flicker {
  0%,93%,100%{ opacity:1; }
  94%{ opacity:.3; }
  95%{ opacity:1; }
  97%{ opacity:.15; }
  98%{ opacity:.9; }
}
@keyframes fadein { to { opacity:1; } }
@keyframes wfloat {
  0%,100%{ transform: translateY(0); }
  50%{ transform: translateY(-5px); }
}
@keyframes countup {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes glitch {
  0%   { clip-path: inset(0 0 100% 0); transform: translate(-2px,0); }
  10%  { clip-path: inset(40% 0 50% 0); transform: translate(2px,0); filter: hue-rotate(90deg); }
  20%  { clip-path: inset(80% 0 5% 0); transform: translate(-1px,0); }
  30%  { clip-path: inset(10% 0 85% 0); transform: translate(0,0); }
  100% { clip-path: inset(0 0 0 0); transform: translate(0,0); filter: none; }
}

function showScreen(id) {

  document.getElementById(id).classList.add('active');
}

function rand(a, b) { return a + Math.random() * (b - a); }
function randInt(a, b) { return Math.floor(rand(a, b + 1)); }

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function easeInExpo(x) {
  return x === 0 ? 0 : Math.pow(2, 10 * x - 10);
}

async function startScan() {
  showScreen('screen-scan');

  const video  = document.getElementById('scan-video');
  const canvas = document.getElementById('hud-canvas');

  function resize() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  // Camera
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
      audio: false
    });
    video.srcObject = stream;
    await video.play().catch(() => {});
  } catch {
    setStatus('CAMERA ACCESS REQUIRED');
    return;
  }

  // MediaPipe
  if (typeof FaceMesh === 'undefined') {
    // Fallback: simulate scan
    simulateScan();
    return;
  }

  faceMesh = new FaceMesh({
    locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/${f}`
  });
  faceMesh.setOptions({
    maxNumFaces: 1,
    refineLandmarks: true,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
  });
  faceMesh.onResults(onScanFrame);

  if (typeof Camera !== 'undefined') {
    scanCam = new Camera(video, {
      onFrame: async () => { await faceMesh.send({ image: video }); },
      width: 640, height: 480
    });
    scanCam.start();
  } else {
    // Manual loop fallback
    const loop = async () => {
      if (!video.paused) await faceMesh.send({ image: video });
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
}

function setStatus(t) {
  document.getElementById('scan-status').textContent = t;
}

function simulateScan() {
  // No MediaPipe available — fake the progress
  irisLabel = 'DARK BROWN';
  const iv = setInterval(() => {
    lockFrames++;
    scanPct = Math.min(100, (lockFrames / LOCK_TARGET) * 100);
    updatePbar();
    if (lockFrames >= LOCK_TARGET) {
      clearInterval(iv);
      setStatus('LOCK CONFIRMED — INITIATING DEEP DIVE');
      setTimeout(startDive, 800);
    }
  }, 120);
}

// LEFT eye indices (outline)
const LE = [33,7,163,144,145,153,154,155,133,173,157,158,159,160,161,246];
// RIGHT eye indices (outline)
const RE = [362,382,381,380,374,373,390,249,263,466,388,387,386,385,384,398];

function onScanFrame(res) {
  const canvas = document.getElementById('hud-canvas');
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (!res.multiFaceLandmarks?.length) {
    lockFrames = Math.max(0, lockFrames - 1);
    scanPct    = Math.max(0, scanPct - 0.5);
    updatePbar();
    setStatus('ACQUIRING TARGET...');
    return;
  }

  const lm = res.multiFaceLandmarks[0];

  // Try grab iris color from pixels around iris center
  if (lockFrames === 15) {
    detectIrisColor(res);
  }

  drawHUD(ctx, lm, canvas.width, canvas.height);

  lockFrames++;
  scanPct = Math.min(100, (lockFrames / LOCK_TARGET) * 100);
  updatePbar();

  if      (lockFrames < 10)   setStatus('FACE DETECTED — IRIS LOCK SEQUENCE...');
  else if (lockFrames < 20)   setStatus('MAPPING IRIS TOPOLOGY...');
  else if (lockFrames < 30)   setStatus('BIOMETRIC SIGNATURE ENCODING...');
  else if (lockFrames === 30) setStatus('LOCK ACQUIRED — DEEP DIVE IN 3s');
  else if (lockFrames === LOCK_TARGET) {
    setStatus('INITIATING SUBCONSCIOUS INTERFACE');
    scanPct = 100; updatePbar();
    if (scanCam) scanCam.stop();
    setTimeout(startDive, 700);
  }
}

function updatePbar() {
  document.getElementById('scan-pbar').style.width = scanPct + '%';
  document.getElementById('scan-pct').textContent   = Math.floor(scanPct) + '%';
}

function detectIrisColor() {
  const labels = ['DARK BROWN','HAZEL','DEEP GREY','AMBER BROWN','DEEP BLACK'];
  irisLabel = labels[Math.floor(Math.random() * labels.length)];
}

function drawHUD(ctx, lm, W, H) {
  // Mirror x: canvas x = (1 - lm.x) * W  (matches mirrored video)
  const px = l => ({ x: (1 - l.x) * W, y: l.y * H });
  const t  = Date.now() / 1000;

  const eyes = [
    { outline: LE, irisC: 468, ring: [469,470,471,472] },
    { outline: RE, irisC: 473, ring: [474,475,476,477] },
  ];

  eyes.forEach((eye, ei) => {
    const ctr = px(lm[eye.irisC]);
    const pts = eye.ring.map(i => px(lm[i]));

    // Iris radius — keep tight, no amplification
    let r = 0;
    pts.forEach(p => r += Math.hypot(p.x - ctr.x, p.y - ctr.y));
    r = (r / pts.length) * 1.4; // was 2.8 — halved to keep HUD near iris

    const pulse = 0.7 + 0.3 * Math.sin(t * 4 + ei * 1.5);

    // Outer scan ring (animated)
    ctx.beginPath();
    ctx.arc(ctr.x, ctr.y, r * 1.7, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(0,245,255,${pulse * 0.25})`;
    ctx.lineWidth = 1;
    ctx.stroke();

    // Rotating tick ring
    ctx.save();
    ctx.translate(ctr.x, ctr.y);
    ctx.rotate(t * 1.8 * (ei ? -1 : 1));
    for (let a = 0; a < Math.PI * 2; a += Math.PI / 8) {
      const [c, s] = [Math.cos(a), Math.sin(a)];
      ctx.beginPath();
      ctx.moveTo(c * r * 1.25, s * r * 1.25);
      ctx.lineTo(c * r * 1.48, s * r * 1.48);
      ctx.strokeStyle = `rgba(0,245,255,${pulse * 0.7})`;
      ctx.lineWidth = 1.5; ctx.stroke();
    }
    ctx.restore();

    // Hexagon frame (counter-rotating) — kept compact
    ctx.save();
    ctx.translate(ctr.x, ctr.y);
    ctx.rotate(t * -0.6 + ei * 0.5);
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2 - Math.PI / 6;
      const m = r * 1.6;  // was 2.45
      i === 0 ? ctx.moveTo(Math.cos(a)*m, Math.sin(a)*m)
              : ctx.lineTo(Math.cos(a)*m, Math.sin(a)*m);
    }
    ctx.closePath();
    ctx.strokeStyle = `rgba(255,45,120,${pulse * 0.5})`;
    ctx.lineWidth = 1; ctx.stroke();
    ctx.restore();

    // Corner nodes
    for (let i = 0; i < 4; i++) {
      const a = (i / 4) * Math.PI * 2 + t * 0.3;
      ctx.beginPath();
      ctx.arc(ctr.x + Math.cos(a) * r * 1.6, ctr.y + Math.sin(a) * r * 1.6, 2.5, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(0,245,255,${pulse})`;
      ctx.fill();
    }

    // Iris circle
    ctx.beginPath();
    ctx.arc(ctr.x, ctr.y, r, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(0,255,65,${pulse * 0.7})`;
    ctx.lineWidth = 1.5; ctx.stroke();

    // Cross-hair
    ctx.beginPath();
    const ch = r * 0.55;
    ctx.moveTo(ctr.x - ch, ctr.y); ctx.lineTo(ctr.x + ch, ctr.y);
    ctx.moveTo(ctr.x, ctr.y - ch); ctx.lineTo(ctr.x, ctr.y + ch);
    ctx.strokeStyle = `rgba(0,255,65,${pulse * 0.4})`;
    ctx.lineWidth = 0.5; ctx.stroke();

    // Lock arc (progress)
    const lockPct = Math.min(1, lockFrames / LOCK_TARGET);
    if (lockPct > 0) {
      ctx.beginPath();
      ctx.arc(ctr.x, ctr.y, r * 1.95, -Math.PI / 2, -Math.PI / 2 + lockPct * Math.PI * 2);
      ctx.strokeStyle = `rgba(255,45,120,${pulse})`;
      ctx.lineWidth = 2; ctx.stroke();
    }

    // Data readout
    const dsize = Math.max(7, r * 0.45);
    ctx.font = `${dsize}px Courier New`;
    ctx.fillStyle = `rgba(0,245,255,${pulse * 0.5})`;
    ctx.fillText(
      `${(t * 100 | 0) % 1000}`.padStart(3,'0'),
      ctr.x + r * 1.75, ctr.y + r * 0.5
    );

    // Store left eye center for dive target
    if (ei === 0) { eyeCX = ctr.x / W; eyeCY = ctr.y / H; }
  });
}

// ============================================================
// DIVE TRANSITION
// ============================================================
function startDive() {
  // Stop scan camera if running
  if (scanCam) { try { scanCam.stop(); } catch {} }

  showScreen('screen-dive');
  const canvas = document.getElementById('dive-canvas');
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
  const ctx = canvas.getContext('2d');

  const W = canvas.width, H = canvas.height;
  const cx = eyeCX * W, cy = eyeCY * H;
  const start = performance.now();
  const DURATION = 2200;

  function frame(now) {
    const p  = Math.min(1, (now - start) / DURATION);
    const ep = easeInExpo(p);

    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    if (p < 0.72) {
      // Tunnel rings zooming toward viewer
      const rings = 10;
      for (let i = 0; i < rings; i++) {
        const phase = ((i / rings) + ep * 2.5) % 1;
        const r     = phase * Math.max(W, H) * 1.5;
        const alpha = (1 - phase) * (1 - p * 0.6) * 0.5;
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(0,245,255,${alpha})`;
        ctx.lineWidth = 1; ctx.stroke();

        ctx.beginPath();
        ctx.arc(cx, cy, r * 0.88, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(255,45,120,${alpha * 0.4})`;
        ctx.lineWidth = .5; ctx.stroke();
      }
      // Glitch scan lines
      if (Math.random() < 0.3) {
        const y = Math.random() * H;
        const ww = Math.random() * W;
        ctx.fillStyle = `rgba(0,255,65,${Math.random() * 0.12})`;
        ctx.fillRect(0, y, ww, 1 + Math.random() * 2);
      }
    } else {
      // White-out
      const wA = (p - 0.72) / 0.28;
      ctx.fillStyle = `rgba(255,255,255,${wA})`;
      ctx.fillRect(0, 0, W, H);
    }

    if (p < 1) requestAnimationFrame(frame);
    else        setTimeout(startSample, 80);
  }
  requestAnimationFrame(frame);
}

function buildGridData() {
  const shuffled = shuffle(CONCEPTS);
  pages = [
    shuffled.slice(0, 12),
    shuffled.slice(12, 24),
    shuffled.slice(24, 36),
  ];
  wordScores = {};
  CONCEPTS.forEach(c => wordScores[c.w] = 0);
}

function renderPage(idx) {
  const grid = document.getElementById('word-grid');
  grid.innerHTML = '';
  wordCells = [];

  pages[idx].forEach(c => {
    const div = document.createElement('div');
    div.className = 'wc';
    div.textContent = c.w;
    div.style.setProperty('--fd', rand(3, 5.5) + 's');
    div.style.setProperty('--dd', (-rand(0, 4)) + 's');
    grid.appendChild(div);
    wordCells.push({ w: c.w, el: div, rect: null });
  });

  // Get rects after layout paint
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      wordCells.forEach(c => { c.rect = c.el.getBoundingClientRect(); });
    });
  });
}

function startPagedTimer() {
  const fill = document.getElementById('timer-fill');
  const PAGE_MS = 10000;
  const TOTAL_MS = PAGE_MS * 3;

  function runPage(pgIdx) {
    const pgStart = Date.now();

    sampleTimerID = setInterval(() => {
      const elapsed = Date.now() - pgStart;
      const totalElapsed = pgIdx * PAGE_MS + elapsed;
      fill.style.width = Math.max(0, (1 - totalElapsed / TOTAL_MS) * 100) + '%';

      if (elapsed >= PAGE_MS) {
        clearInterval(sampleTimerID);
        if (pgIdx < 2) {
          // Fade out → swap content → fade in
          const grid = document.getElementById('word-grid');
          grid.style.opacity = '0';
          setTimeout(() => {
            renderPage(pgIdx + 1);
            grid.style.opacity = '1';
            runPage(pgIdx + 1);
          }, 500);
        } else {
          endSample();
        }
      }
    }, 200);
  }

  runPage(0);
}

async function startSample() {
  buildGridData();
  renderPage(0);
  showScreen('screen-sample');

  const video = document.getElementById('sample-video');

  // Reacquire camera
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 320 }, height: { ideal: 240 } },
      audio: false
    });
    video.srcObject = stream;
    await video.play().catch(() => {});
  } catch {
    // No camera: fall back to randomized scoring
    randomizeScores();
    startPagedTimer();
    return;
  }

  if (typeof FaceMesh === 'undefined') {
    randomizeScores();
    startPagedTimer();
    return;
  }

  sampleMesh = new FaceMesh({
    locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/${f}`
  });
  sampleMesh.setOptions({
    maxNumFaces: 1,
    refineLandmarks: true,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
  });
  sampleMesh.onResults(onSampleFrame);

  if (typeof Camera !== 'undefined') {
    sampleCam = new Camera(video, {
      onFrame: async () => { await sampleMesh.send({ image: video }); },
      width: 320, height: 240
    });
    sampleCam.start();
  } else {
    const loop = async () => {
      if (!video.paused) await sampleMesh.send({ image: video });
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }

  startPagedTimer();
}

function randomizeScores() {
  // Organic-feeling distribution (not flat random)
  CONCEPTS.forEach(c => {
    wordScores[c.w] = Math.pow(Math.random(), 0.7) * 100;
  });
}

function onSampleFrame(res) {
  if (!res.multiFaceLandmarks?.length) return;
  const lm = res.multiFaceLandmarks[0];

  // Gaze estimation:
  // 1. Head pose: nose tip (lm[1]) position in frame
  // 2. Iris offset: iris position relative to eye span
  const nose = lm[1];

  // Head contribution (mirrored)
  let hx = 1 - nose.x; // mirror
  let hy = nose.y;

  // Iris contribution (if available)
  let ix = hx, iy = hy;
  if (lm[468] && lm[473]) {
    const li = lm[468], ri = lm[473];
    // Left eye: outer=33, inner=133
    const lo = lm[33], lin = lm[133];
    const ro = lm[362], rin = lm[263];

    const lewW = Math.abs(lin.x - lo.x) || 0.01;
    const rewW = Math.abs(rin.x - ro.x) || 0.01;

    const lgx = (li.x - Math.min(lo.x, lin.x)) / lewW;
    const rgx = (ri.x - Math.min(ro.x, rin.x)) / rewW;

    const rawIx = (lgx + rgx) / 2; // 0=left, 1=right in camera
    ix = 1 - rawIx; // mirror
    iy = (li.y + ri.y) / 2;
  }

  // Blend head pose + iris
  const bx = hx * 0.6 + ix * 0.4;
  const by = hy * 0.7 + iy * 0.3;

  // Smooth
  gazeX = gazeX * 0.75 + bx * 0.25;
  gazeY = gazeY * 0.75 + by * 0.25;

  // Map to screen
  const sx = gazeX * window.innerWidth;
  const sy = gazeY * window.innerHeight;

  // Score words under gaze
  wordCells.forEach(cell => {
    if (!cell.rect) return;
    const margin = 20; // tolerance in px
    if (sx >= cell.rect.left - margin && sx <= cell.rect.right  + margin &&
        sy >= cell.rect.top  - margin && sy <= cell.rect.bottom + margin) {
      wordScores[cell.w] = (wordScores[cell.w] || 0) + 1;
    }
  });
}

function endSample() {
  if (sampleCam) { try { sampleCam.stop(); } catch {} }

  // Ensure scores have some variance even with tracking (add base noise)
  CONCEPTS.forEach(c => {
    wordScores[c.w] = (wordScores[c.w] || 0) + Math.random() * 5;
  });

  const sorted = Object.entries(wordScores).sort((a, b) => b[1] - a[1]);
  const primary    = sorted.slice(0, 3).map(([w]) => w);
  const suppressed = sorted.slice(-3).map(([w]) => w);

  showResult(primary, suppressed);
}

    <div class="cta-box">
      <div class="cta-lbl">// FULL PROFILING REPORT AVAILABLE</div>
      <div class="cta-txt">
        あなたのアーキタイプ <strong>${archetype.code}</strong> を含む
        <strong>21の属性タイプ</strong>の完全解説と、<br>
        注視パターンが示す<strong>深層構造の全貌</strong>を有料レポートで開示します。<br><br>
        <em>※ このセッションデータは閲覧終了後に自動消去されます</em>
      </div>
      <a class="cta-btn" href="${NOTE_URL}" target="_blank" rel="noopener">
        UNLOCK FULL REPORT — ${NOTE_PRICE}
      </a>
    </div>

    <button class="retry-btn" onclick="retryAll()">[ RE-ANALYZE — 再スキャン ]</button>
  `;

  document.getElementById('rc').innerHTML = html;
  showScreen('screen-result');
  document.getElementById('screen-result').scrollTop = 0;

  // Count-up animation for compat number
  animateCompat(compat);
}

function animateCompat(target) {
  const el = document.getElementById('compat-num');
  if (!el) return;
  let cur = 0;
  const step = () => {
    cur = Math.min(target, cur + Math.ceil((target - cur) / 8) + 1);
    el.textContent = cur + '%';
    if (cur < target) requestAnimationFrame(step);
  };
  setTimeout(step, 400);
}

// ============================================================
// RETRY
// ============================================================
function retryAll() {
  // Reset state
  lockFrames = 0; scanPct = 0;
  wordScores = {}; wordCells = []; pages = [];
  gazeX = 0.5; gazeY = 0.5;
  irisLabel = 'UNDETERMINED';
  eyeCX = 0.5; eyeCY = 0.5;

  document.getElementById('scan-pbar').style.width = '0%';
  document.getElementById('scan-pct').textContent  = '0%';
  setStatus('ACQUIRING TARGET...');

  showScreen('screen-boot');
  document.getElementById('boot-btn').classList.remove('visible');
  setTimeout(runBoot, 50);
}

// ============================================================
// INIT
// ============================================================
window.addEventListener('DOMContentLoaded', runBoot);
</script>
</body>
</html>
